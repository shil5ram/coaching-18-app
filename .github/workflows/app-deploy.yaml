name: Build and Push Docker Image to Amazon ECR

on:
  push:
    branches:
      - main
    paths:
      - "flask2s3/**"
      - "flask2sqs/**"
      - ".github/workflows/**"
  workflow_dispatch: # Allows manual triggering from GitHub UI

permissions:
  id-token: write   # Required for requesting the JWT from AWS OIDC
  contents: read    # Required for actions/checkout

jobs:
  deploy:
    name: Build & Push
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [flask2s3, flask2sqs]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          APP_DIR: ${{ matrix.app }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$APP_DIR-$IMAGE_TAG -t $REGISTRY/$REPOSITORY:$APP_DIR-latest ./$APP_DIR
          docker push $REGISTRY/$REPOSITORY:$APP_DIR-$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:$APP_DIR-latest